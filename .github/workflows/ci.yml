name: CI

on:
  # Only the mainline on push - a branch with an open PR is already covered by
  # the pull_request trigger, and listing '**' here runs everything twice.
  # Extra names so CI survives the default branch being renamed.
  push:
    branches:
      - claude/react-native-icloud-app-01NJvhKiXNUPgynF5KPV5qS1
      - main
      - master
  pull_request:

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Node the suites are developed against.
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # The same command Vercel runs. It catches import errors and version
      # mismatches that the logic tests cannot see - the expo-font/SDK 50
      # mismatch that stopped the app booting showed up here first.
      - name: Build web bundle
        run: npx expo export:web
        env:
          CI: '1'

      - name: Check the bundle actually came out
        run: test -f web-build/index.html
